name: Go tests

# Automatic CI disabled by owner request; run only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      PIGO_LIVE_TEST: '0'
      PI_GO_AGENT_LIVE_TEST: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Module graph
        run: go list -mod=readonly -m all
      - name: Provider race tests
        run: go test -mod=readonly -count=1 -race ./pkg/pigo
      - name: All packages
        run: go test -mod=readonly -count=1 ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Examples
        working-directory: examples
        run: |
          go list -mod=readonly -m all
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...

  codemode:
    name: Codemode and MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      PIGO_LIVE_TEST: '0'
      PI_GO_AGENT_LIVE_TEST: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/go.sum
      - name: Sandbox and common execution contract
        run: go test -mod=readonly -count=1 -race ./codemode/... ./mcp ./agent ./agent/mcptools ./agent/mcpresources ./agent/codemodetool ./agent/toolset ./agent/session ./agent/skills
      - name: Compile local MCP example
        working-directory: examples
        run: go build -mod=readonly -o mcp-codemode-example.exe ./mcp-codemode
      - name: Run local MCP example
        working-directory: examples
        shell: bash
        run: ./mcp-codemode-example.exe
      - name: Compile managed MCP example
        working-directory: examples
        run: go build -mod=readonly -o mcp-managed-example.exe ./mcp-managed
      - name: Run managed MCP example
        working-directory: examples
        shell: bash
        run: ./mcp-managed-example.exe

      - name: Managed session restart and compaction
        working-directory: examples
        run: go test -mod=readonly -count=1 -race ./mcp-managed
